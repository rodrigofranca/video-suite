services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ultramedia
      POSTGRES_PASSWORD: ultramedia
      POSTGRES_DB: ultramedia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ultramedia -d ultramedia"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # S3-compatible object storage (see docs/adr/0008-rustfs-for-local-storage.md).
  # API on :9000, web console on :9001.
  storage:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ACCESS_KEY: ultramedia
      RUSTFS_SECRET_KEY: ultramedia
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot job: creates the bucket, applies CORS and makes only the HLS
  # output and thumbnails (assets/*/hls/*, assets/*/thumbnails/*) publicly
  # readable, so the dashboard (localhost:5173) loads them straight from
  # storage. See docs/adr/0010 and 0013.
  storage-init:
    image: amazon/aws-cli:2.39.6
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ultramedia
      AWS_SECRET_ACCESS_KEY: ultramedia
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./infra/storage:/config:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S3="aws --endpoint-url http://storage:9000"
        $$S3 s3api head-bucket --bucket ultramedia 2>/dev/null || $$S3 s3api create-bucket --bucket ultramedia
        $$S3 s3api put-bucket-cors --bucket ultramedia --cors-configuration file:///config/cors.json
        $$S3 s3api put-bucket-policy --bucket ultramedia --policy file:///config/public-read-policy.json
        echo "bucket ultramedia ready"
    restart: "no"

  # Language model gateway (docs/adr/0018). The AI worker calls it with the
  # OpenAI API and the model name "ultramedia-text"; infra/litellm/config.yaml
  # maps that name to a provider's model (OpenCode). The provider key is only
  # set here, from OPENCODE_API_KEY in .env.
  # Pinned by digest and signature-checked: LiteLLM 1.107.0 (Oct 2026) was a
  # malicious release. Upgrade deliberately, never to a floating tag.
  litellm:
    image: ghcr.io/berriai/litellm:v1.108.2@sha256:d8b4ac356743d647a13bb93f45b941fcd5f5354122cfd205948a1b192790389d
    command: ["--config", "/config/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-ultramedia-dev}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENCODE_API_BASE: ${OPENCODE_API_BASE:-https://opencode.ai/zen/v1}
      # Use the price list shipped in the image instead of downloading it
      # from GitHub's main branch at every start.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      LITELLM_TELEMETRY_DISABLED: "true"
    volumes:
      - ./infra/litellm:/config:ro
    ports:
      # Only this machine: the gateway holds the provider key.
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40

  # ---- Application (profile "app", started by `make demo`) ----
  # For development, run these with `make dev-api`, `make dev-worker` and
  # `make dev-dashboard` instead; they use the same ports.

  migrate:
    image: migrate/migrate:v4.19.1
    profiles: [app]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "postgres://ultramedia:ultramedia@postgres:5432/ultramedia?sslmode=disable", "up"]
    restart: "no"

  api:
    image: ultramedia/api:dev
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
      target: api
    profiles: [app]
    environment: &app-env
      DATABASE_URL: postgres://ultramedia:ultramedia@postgres:5432/ultramedia?sslmode=disable
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://storage:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ultramedia
      S3_SECRET_KEY: ultramedia
      S3_BUCKET: ultramedia
      # The browser reads public files from the host port, not the
      # container network name.
      S3_PUBLIC_URL: http://localhost:9000
      DASHBOARD_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on: &app-deps
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  worker:
    image: ultramedia/worker:dev
    build:
      context: .
      dockerfile: infra/docker/go.Dockerfile
      target: worker
    profiles: [app]
    environment:
      <<: *app-env
      # Stable name: a restarted worker resumes the job it was running.
      WORKER_NAME: worker-1
    depends_on: *app-deps
    restart: unless-stopped

  ai-worker:
    image: ultramedia/ai-worker:dev
    build:
      context: .
      dockerfile: infra/docker/ai-worker.Dockerfile
    profiles: [app]
    environment:
      <<: *app-env
      AI_WORKER_NAME: ai-worker-1
      # tiny, base, small, medium...: bigger is more accurate and slower.
      WHISPER_MODEL: base
      LLM_BASE_URL: http://litellm:4000/v1
      LLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-ultramedia-dev}
      LLM_MODEL: ultramedia-text
    volumes:
      # Downloaded Whisper models survive restarts and rebuilds.
      - whisper_models:/models
    depends_on:
      <<: *app-deps
      litellm:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    image: ultramedia/dashboard:dev
    build:
      context: .
      dockerfile: infra/docker/dashboard.Dockerfile
      args:
        PUBLIC_API_URL: http://localhost:8080
    profiles: [app]
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  storage_data:
  whisper_models:
